# Stand-in for a global load balancer (for example Route 53 latency or
# failover routing). Runs as the global-lb container on the kind network;
# started by scripts/setup-region.sh lb.
events {}

http {
  upstream regions {
    # Region A and region B Istio gateways (NodePort 30080 on each cluster).
    # A region that refuses connections is skipped for 10 seconds.
    server dev-cluster-control-plane:30080 max_fails=1 fail_timeout=10s;
    server region-b-control-plane:30080    max_fails=1 fail_timeout=10s;
  }

  server {
    listen 7080;

    location / {
      proxy_pass http://regions;
      # If one region fails, retry the request in the other.
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
      add_header x-served-via global-lb always;
    }
  }
}
