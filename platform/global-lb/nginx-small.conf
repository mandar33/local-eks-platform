# Stand-in for a global load balancer (for example Route 53 latency or
# failover routing). Runs as the global-lb container on the kind network;
# started by scripts/setup-region.sh lb; scripts/profile.sh swaps the config.
# Profile small: prod runs in region B only.
events {}

http {
  upstream regions {
    # Region B's Istio gateway (NodePort 30080).
    # If it refuses connections, it is skipped for 10 seconds (and nothing answers).
    server region-b-control-plane:30080    max_fails=1 fail_timeout=10s;
  }

  server {
    listen 7080;

    location / {
      proxy_pass http://regions;
      # One region only: nothing to fail over to (the small profile's trade-off).
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
      add_header x-served-via global-lb always;
    }
  }
}
