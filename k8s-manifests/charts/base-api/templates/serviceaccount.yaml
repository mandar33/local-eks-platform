{{- if ne .Values.track "canary" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  # One identity per app, so Istio AuthorizationPolicies can tell callers apart
  # (principal: cluster.local/ns/<namespace>/sa/<nameOverride>)
  name: {{ .Values.nameOverride }}
  namespace: {{ .Release.Namespace }}
{{- end }}
