{{- if or (ne .Values.track "canary") .Values.canary.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "base-api.deploymentName" . }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- if eq .Values.track "canary" }}
  replicas: {{ .Values.canary.replicas }}
  {{- end }}
  # Stable has no `replicas`: the HPA owns the replica count.
  selector:
    matchLabels:
      app: {{ .Values.nameOverride }}
      track: {{ .Values.track }}
  template:
    metadata:
      labels:
        app: {{ .Values.nameOverride }}
        track: {{ .Values.track }}
        # Istio uses `version` in telemetry; the image tag is the version.
        version: {{ .Values.image.tag | quote }}
    spec:
      serviceAccountName: {{ .Values.nameOverride }}
      containers:
      - name: api
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: 8000
        env:
        # Returned by frontend-api as the x-app-version response header.
        - name: APP_VERSION
          value: {{ .Values.image.tag | quote }}
        {{- range $name, $value := .Values.env }}
        - name: {{ $name }}
          value: {{ $value | quote }}
        {{- end }}
        {{- range $name, $ref := .Values.secretEnv }}
        - name: {{ $name }}
          valueFrom:
            secretKeyRef:
              name: {{ $ref.secret }}
              key: {{ $ref.key }}
        {{- end }}
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: "100m"
{{- end }}
