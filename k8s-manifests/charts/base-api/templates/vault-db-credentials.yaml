{{- if and .Values.vaultDbCredentials.enabled (ne .Values.track "canary") }}
{{- $v := .Values.vaultDbCredentials }}
# Short-lived DB credentials from Vault's database engine. The Vault Secrets
# Operator logs in as this app's ServiceAccount, writes the user and password
# to the Secret, and restarts the Deployment when they rotate.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: {{ .Release.Namespace }}
spec:
  address: {{ $v.address }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ .Values.nameOverride }}
  namespace: {{ .Release.Namespace }}
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: {{ $v.authMount }}
  kubernetes:
    role: {{ required "vaultDbCredentials.role is required" $v.role }}
    serviceAccount: {{ .Values.nameOverride }}
    audiences: ["vault"]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: {{ $v.secretName }}
  namespace: {{ .Release.Namespace }}
spec:
  vaultAuthRef: {{ .Values.nameOverride }}
  mount: {{ $v.mount }}
  path: {{ $v.path }}
  destination:
    name: {{ $v.secretName }}
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ .Values.nameOverride }}
{{- end }}
