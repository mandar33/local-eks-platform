# These are defaults that will be overridden by the environment files
nameOverride: "default-api"
image:
  repository: "your-registry/default"
  tag: "latest"
# stable: the normal release (Deployment, Service, HPA, ServiceAccount).
# canary: an extra Deployment named <nameOverride>-canary that shares the
#         stable release's Service and ServiceAccount. Istio decides how much
#         traffic it gets (see platform/region-a/networking/).
track: stable
canary:
  enabled: true
  replicas: 1
autoscaling:
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
# Plain env vars (name: value). Never put secrets here.
env: {}
# Env vars read from a Kubernetes Secret: NAME: {secret: <secret name>, key: <key>}
secretEnv: {}

# Optional extras, all off by default. Cells turn them on; they're what the
# Crossplane Cell composition used to add. (The namespace's istio-injection
# label comes from Argo CD's managedNamespaceMetadata, not from this chart.)

# Vault Secrets Operator resources that keep a Secret filled with short-lived
# DB credentials and restart this Deployment when they rotate.
vaultDbCredentials:
  enabled: false
  address: http://vault.vault.svc.cluster.local:8200
  authMount: kubernetes   # kubernetes-region-b for region B
  role: ""                # Vault role bound to this app's ServiceAccount + namespace
  mount: database
  path: creds/crud-api
  secretName: crud-db

# Istio AuthorizationPolicy: only these apps (ServiceAccount names in the same
# namespace) may call this one. Empty = no policy.
allowCallersFrom: []

# PodDisruptionBudget. 0 = none. Needs minReplicas > minAvailable.
podDisruptionBudget:
  minAvailable: 0
