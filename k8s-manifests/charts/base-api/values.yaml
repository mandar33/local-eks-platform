# These are defaults that will be overridden by the environment files
nameOverride: "default-api"
image:
  repository: "your-registry/default"
  tag: "latest"
# stable: the normal release (Deployment, Service, HPA, ServiceAccount).
# canary: an extra Deployment named <nameOverride>-canary that shares the
#         stable release's Service and ServiceAccount. Istio decides how much
#         traffic it gets (see environments/dev/networking/).
track: stable
canary:
  enabled: true
  replicas: 1
autoscaling:
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
# Plain env vars (name: value). Never put secrets here.
env: {}
# Env vars read from a Kubernetes Secret: NAME: {secret: <secret name>, key: <key>}
secretEnv: {}
