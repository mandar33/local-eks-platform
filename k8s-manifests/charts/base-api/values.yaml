# These are defaults that will be overridden by the environment files
nameOverride: "default-api"
image:
  repository: "your-registry/default"
  tag: "latest"
autoscaling:
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
# Plain env vars (name: value). Never put secrets here.
env: {}
# Env vars read from a Kubernetes Secret: NAME: {secret: <secret name>, key: <key>}
secretEnv: {}
