apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: platform-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
# Two groups of frontend pods, told apart by the chart's `track` label.
# Must live in the service's namespace (or the caller's): Istio ignores a
# DestinationRule elsewhere, and routes to its subsets then fail with 503.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: frontend-api
  namespace: dev
spec:
  host: frontend-api-svc.dev.svc.cluster.local
  subsets:
  - name: stable
    labels:
      track: stable
  - name: canary
    labels:
      track: canary
---
# dev.localhost:8080 -> dev. Canary weight lives here:
#   0   = canary gets nothing (use this when canary.enabled is false)
#   10  = one request in ten goes to the canary
# `x-canary: always` sends a request to the canary regardless of weight.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: frontend-routing
spec:
  gateways:
  - platform-gateway
  hosts:
  - dev.localhost
  http:
  - name: force-canary
    match:
    - headers:
        x-canary:
          exact: always
    route:
    - destination:
        host: frontend-api-svc.dev.svc.cluster.local
        subset: canary
        port:
          number: 80
    headers:
      response:
        set:
          x-region: a
  - name: weighted
    route:
    - destination:
        host: frontend-api-svc.dev.svc.cluster.local
        subset: stable
        port:
          number: 80
      weight: 100
    - destination:
        host: frontend-api-svc.dev.svc.cluster.local
        subset: canary
        port:
          number: 80
      weight: 0
    headers:
      response:
        set:
          x-region: a
---
# Same split for calls from inside the mesh. Keep the weights in step with
# frontend-routing above.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: frontend-api-mesh
spec:
  gateways:
  - mesh
  hosts:
  - frontend-api-svc.dev.svc.cluster.local
  http:
  - name: force-canary
    match:
    - headers:
        x-canary:
          exact: always
    route:
    - destination:
        host: frontend-api-svc.dev.svc.cluster.local
        subset: canary
  - name: weighted
    route:
    - destination:
        host: frontend-api-svc.dev.svc.cluster.local
        subset: stable
      weight: 100
    - destination:
        host: frontend-api-svc.dev.svc.cluster.local
        subset: canary
      weight: 0
---
# staging.localhost:8080 -> staging. More specific than "*" above, so Istio
# picks this one for that host.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: staging-routing
spec:
  gateways:
  - platform-gateway
  hosts:
  - staging.localhost
  http:
  - route:
    - destination:
        host: frontend-api-svc.staging.svc.cluster.local
        port:
          number: 80
    headers:
      response:
        set:
          x-region: a
          x-env: staging
