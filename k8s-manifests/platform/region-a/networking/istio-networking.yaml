apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: platform-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
# Two groups of frontend pods, told apart by the chart's `track` label.
# Must live in the service's namespace (or the caller's): Istio ignores a
# DestinationRule elsewhere, and routes to its subsets then fail with 503.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: frontend-api
  namespace: dev
spec:
  host: frontend-api-svc.dev.svc.cluster.local
  subsets:
  - name: stable
    labels:
      track: stable
  - name: canary
    labels:
      track: canary
---
# dev.localhost:8080 -> dev. Canary weight lives here:
#   0   = canary gets nothing (use this when canary.enabled is false)
#   10  = one request in ten goes to the canary
# `x-canary: always` sends a request to the canary regardless of weight.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: frontend-routing
spec:
  gateways:
  - platform-gateway
  hosts:
  - dev.localhost
  http:
  - name: force-canary
    match:
    - headers:
        x-canary:
          exact: always
    route:
    - destination:
        host: frontend-api-svc.dev.svc.cluster.local
        subset: canary
        port:
          number: 80
    headers:
      response:
        set:
          x-region: a
  - name: weighted
    route:
    - destination:
        host: frontend-api-svc.dev.svc.cluster.local
        subset: stable
        port:
          number: 80
      weight: 100
    - destination:
        host: frontend-api-svc.dev.svc.cluster.local
        subset: canary
        port:
          number: 80
      weight: 0
    headers:
      response:
        set:
          x-region: a
---
# Same split for calls from inside the mesh. Keep the weights in step with
# frontend-routing above.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: frontend-api-mesh
spec:
  gateways:
  - mesh
  hosts:
  - frontend-api-svc.dev.svc.cluster.local
  http:
  - name: force-canary
    match:
    - headers:
        x-canary:
          exact: always
    route:
    - destination:
        host: frontend-api-svc.dev.svc.cluster.local
        subset: canary
  - name: weighted
    route:
    - destination:
        host: frontend-api-svc.dev.svc.cluster.local
        subset: stable
      weight: 100
    - destination:
        host: frontend-api-svc.dev.svc.cluster.local
        subset: canary
      weight: 0
---
# staging.localhost:8080 -> staging. More specific than "*" above, so Istio
# picks this one for that host.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: staging-routing
spec:
  gateways:
  - platform-gateway
  hosts:
  - staging.localhost
  http:
  - route:
    - destination:
        host: frontend-api-svc.staging.svc.cluster.local
        port:
          number: 80
    headers:
      response:
        set:
          x-region: a
          x-env: staging
---
# Prod: localhost:8080 (and anything not matched above, including
# cells.localhost and the global LB on localhost:7080) goes to region A's
# prod cells. Real systems look the user up in a routing table; here the
# user ID's last digit decides:
#   odd -> prod-a1      even -> prod-a2      x-cell: prod-a1|prod-a2 pins a request
# Responses carry x-cell saying which cell answered.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: prod-router
  annotations:
    # Moving to profiles/bigtech (phase 8): the old app must not delete it meanwhile.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  gateways:
  - platform-gateway
  hosts:
  - "*"
  http:
  - name: pinned-a1
    match:
    - headers:
        x-cell:
          exact: prod-a1
    route:
    - destination:
        host: frontend-api-svc.prod-a1.svc.cluster.local
        port:
          number: 80
    headers:
      response:
        set:
          x-region: a
          x-cell: prod-a1
  - name: pinned-a2
    match:
    - headers:
        x-cell:
          exact: prod-a2
    route:
    - destination:
        host: frontend-api-svc.prod-a2.svc.cluster.local
        port:
          number: 80
    headers:
      response:
        set:
          x-region: a
          x-cell: prod-a2
  - name: odd-users
    match:
    - uri:
        regex: "/users/[0-9]*[13579]"
    route:
    - destination:
        host: frontend-api-svc.prod-a1.svc.cluster.local
        port:
          number: 80
    headers:
      response:
        set:
          x-region: a
          x-cell: prod-a1
  - name: even-users
    match:
    - uri:
        regex: "/users/[0-9]*[02468]"
    route:
    - destination:
        host: frontend-api-svc.prod-a2.svc.cluster.local
        port:
          number: 80
    headers:
      response:
        set:
          x-region: a
          x-cell: prod-a2
  - name: everything-else
    route:
    - destination:
        host: frontend-api-svc.prod-a1.svc.cluster.local
        port:
          number: 80
    headers:
      response:
        set:
          x-region: a
          x-cell: prod-a1
