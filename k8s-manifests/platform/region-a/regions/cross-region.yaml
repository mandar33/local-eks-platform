# Region A services that region B uses. NodePorts are reachable from other kind
# clusters on the Docker "kind" network, not from the laptop (kind only
# publishes the ports listed in kind-config.yaml).
#
# Only Vault now: region B has its own Postgres (platform/region-b/data/).
apiVersion: v1
kind: Service
metadata:
  name: vault-cross-region
  namespace: vault
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: vault
    component: server
  ports:
    - name: http
      port: 8200
      targetPort: 8200
      nodePort: 30820
