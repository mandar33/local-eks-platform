# Region B's gateway (localhost:9080). What it routes to depends on the
# profile: profiles/<profile>/routing-region-b/.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: platform-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
