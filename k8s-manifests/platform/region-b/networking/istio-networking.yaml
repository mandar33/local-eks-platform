# Region B's front door (localhost:9080): its prod cell, prod-b1. Every
# response says x-region: b.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: platform-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: frontend-routing
spec:
  gateways:
  - platform-gateway
  hosts:
  - "*"
  http:
  - route:
    - destination:
        host: frontend-api-svc.prod-b1.svc.cluster.local
        port:
          number: 80
    headers:
      response:
        set:
          x-region: b
          x-cell: prod-b1
