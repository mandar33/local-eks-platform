# Region B's crud-api gets DB users from region A's Vault. It logs in through
# a separate auth mount (kubernetes-region-b) that trusts region B's API
# server, so each region keeps its own identity. See scripts/setup-region.sh.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: default
spec:
  address: http://dev-cluster-control-plane:30820
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: crud-api
  namespace: default
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes-region-b
  kubernetes:
    role: crud-api
    serviceAccount: crud-api
    audiences: ["vault"]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: crud-db
  namespace: default
spec:
  vaultAuthRef: crud-api
  mount: database
  path: creds/crud-api
  destination:
    name: crud-db
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: crud-api
