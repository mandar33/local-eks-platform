---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cross-region-dev
  namespace: argocd
spec:
  # NodePorts for Vault and Postgres that region B connects to.
  project: default
  source:
    repoURL: https://github.com/mandar33/local-eks-platform.git
    targetRevision: main
    path: k8s-manifests/environments/dev/regions
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flipt-dev
  namespace: argocd
spec:
  # Flipt (feature flags). Was a manual helm install; now managed from Git.
  project: default
  sources:
    # Flipt's official chart, pinned...
    - repoURL: https://helm.flipt.io
      chart: flipt
      targetRevision: 0.87.9
      helm:
        releaseName: flipt
        valueFiles:
          - $values/k8s-manifests/environments/dev/flipt-values.yaml
    # ...with its values from this repo ("$values" above points here).
    - repoURL: https://github.com/mandar33/local-eks-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
