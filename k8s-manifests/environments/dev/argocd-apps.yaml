# kubectl apply -n argocd -f k8s-manifests/environments/dev/argocd-apps.yaml
# The API apps render charts/base-api with their own values file;
# platform-networking-dev syncs networking/ (Istio), postgres-dev syncs data/,
# vault-secrets-dev syncs secrets/ (Vault Secrets Operator resources),
# registry-dev syncs registry/ (Zot), kargo-dev syncs kargo/ (promotions),
# frontend-api-canary-dev runs the frontend canary (frontend-canary-values.yaml),
# crossplane-dev defines the Cell API; cell-a and cell-b create one cell each,
# flipt-dev runs Flipt from its official chart with flipt-values.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-api-dev
  namespace: argocd
  annotations:
    # Lets Kargo's "dev" Stage trigger syncs of this app (see kargo/).
    kargo.akuity.io/authorized-stage: local-eks-platform:dev
spec:
  project: default
  source:
    repoURL: https://github.com/mandar33/local-eks-platform.git
    targetRevision: main
    path: k8s-manifests/charts/base-api
    helm:
      releaseName: frontend-api
      valueFiles:
        - ../../environments/dev/frontend-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crud-api-dev
  namespace: argocd
  annotations:
    # Lets Kargo's "dev" Stage trigger syncs of this app (see kargo/).
    kargo.akuity.io/authorized-stage: local-eks-platform:dev
spec:
  project: default
  source:
    repoURL: https://github.com/mandar33/local-eks-platform.git
    targetRevision: main
    path: k8s-manifests/charts/base-api
    helm:
      releaseName: crud-api
      valueFiles:
        - ../../environments/dev/crud-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-networking-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mandar33/local-eks-platform.git
    targetRevision: main
    path: k8s-manifests/environments/dev/networking
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mandar33/local-eks-platform.git
    targetRevision: main
    path: k8s-manifests/environments/dev/data
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secrets-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mandar33/local-eks-platform.git
    targetRevision: main
    path: k8s-manifests/environments/dev/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The VSO CRDs appear only after scripts/bootstrap-vault.sh runs.
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: registry-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mandar33/local-eks-platform.git
    targetRevision: main
    path: k8s-manifests/environments/dev/registry
  destination:
    server: https://kubernetes.default.svc
    namespace: registry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Needs cert-manager and the Vault Secrets Operator CRDs.
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mandar33/local-eks-platform.git
    targetRevision: main
    path: k8s-manifests/environments/dev/kargo
  destination:
    server: https://kubernetes.default.svc
    namespace: local-eks-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The Project creates the namespace, so later resources may need a retry.
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-api-canary-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mandar33/local-eks-platform.git
    targetRevision: main
    path: k8s-manifests/charts/base-api
    helm:
      releaseName: frontend-api-canary
      # Same values as stable, then the canary overrides on top.
      valueFiles:
        - ../../environments/dev/frontend-values.yaml
        - ../../environments/dev/frontend-canary-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      # With canary.enabled: false the release is empty; let Argo CD remove it.
      allowEmpty: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-dev
  namespace: argocd
spec:
  # The Cell API: Crossplane functions, RBAC, XRD and Composition.
  project: default
  source:
    repoURL: https://github.com/mandar33/local-eks-platform.git
    targetRevision: main
    path: k8s-manifests/environments/dev/crossplane
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cell-a
  namespace: argocd
  annotations:
    # Lets Kargo's "cell-a" Stage trigger syncs of this app.
    kargo.akuity.io/authorized-stage: local-eks-platform:cell-a
spec:
  # Cell a (cells/cell-a.yaml). Needs crossplane-dev first, hence the retry.
  project: default
  source:
    repoURL: https://github.com/mandar33/local-eks-platform.git
    targetRevision: main
    path: k8s-manifests/environments/dev/cells
    directory:
      include: cell-a.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cell-b
  namespace: argocd
  annotations:
    # Lets Kargo's "cell-b" Stage trigger syncs of this app.
    kargo.akuity.io/authorized-stage: local-eks-platform:cell-b
spec:
  # Cell b (cells/cell-b.yaml). Needs crossplane-dev first, hence the retry.
  project: default
  source:
