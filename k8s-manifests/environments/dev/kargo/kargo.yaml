# Kargo: moves each release through the stages, one at a time.
#
#   CI pushes frontend-api:1.2.N and crud-api:1.2.N to Zot
#     -> the Warehouse "app-images" sees both and records them as one Freight
#        (a matched pair: they always travel together)
#     -> dev -> region-b -> cell-a -> cell-b
#        each Stage accepts only Freight the stage before it already has
#     -> a Stage writes both image tags into its own files in Git, commits as
#        "Kargo", pushes, and asks Argo CD to sync
#
# Promote with scripts/promote.sh <stage> <version>, the Kargo UI, or a
# Promotion resource. CI promotes to dev after your approval on GitHub.
#
# Kargo commits with a GitHub token that lives only in Vault
# (scripts/set-kargo-git-token.sh). The Vault Secrets Operator copies it into
# this project's namespace as a Kargo git credential.
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: local-eks-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
# Watches Zot for both apps. Freight = the newest 1.x.y of each, as a pair.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: app-images
  namespace: local-eks-platform
spec:
  subscriptions:
    # Kargo runs in the cluster, so it uses Zot's in-cluster name. The nodes
    # pull the same images as localhost:5001/<app>. Zot's certificate comes
    # from the cluster's own CA, which Kargo doesn't trust; traffic is still
    # encrypted.
    - image:
        repoURL: zot.registry.svc.cluster.local:5000/frontend-api
        imageSelectionStrategy: SemVer
        constraint: ^1.0.0
        insecureSkipTLSVerify: true
    - image:
        repoURL: zot.registry.svc.cluster.local:5000/crud-api
        imageSelectionStrategy: SemVer
        constraint: ^1.0.0
        insecureSkipTLSVerify: true
---
# Region A main copy. CI promotes here after your approval.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: local-eks-platform
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: app-images
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: gitRepo
          value: https://github.com/mandar33/local-eks-platform.git
        - name: frontend
          value: zot.registry.svc.cluster.local:5000/frontend-api
        - name: crud
          value: zot.registry.svc.cluster.local:5000/crud-api
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitRepo }}
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          config:
            path: ./repo/k8s-manifests/environments/dev/frontend-values.yaml
            updates:
              - key: image.tag
                value: ${{ imageFrom(vars.frontend).Tag }}
        - uses: yaml-update
          config:
            path: ./repo/k8s-manifests/environments/dev/crud-values.yaml
            updates:
              - key: image.tag
                value: ${{ imageFrom(vars.crud).Tag }}
        - uses: git-commit
          config:
            path: ./repo
            message: "dev: frontend-api ${{ imageFrom(vars.frontend).Tag }}, crud-api ${{ imageFrom(vars.crud).Tag }} (promoted by Kargo)"
        - uses: git-push
          config:
            path: ./repo
        - uses: argocd-update
          config:
            apps:
              - name: frontend-api-dev
                namespace: argocd
              - name: crud-api-dev
                namespace: argocd
---
# Region B: only versions dev already has.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: region-b
  namespace: local-eks-platform
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: app-images
      sources:
        stages:
          - dev
  promotionTemplate:
    spec:
      vars:
        - name: gitRepo
          value: https://github.com/mandar33/local-eks-platform.git
        - name: frontend
          value: zot.registry.svc.cluster.local:5000/frontend-api
        - name: crud
          value: zot.registry.svc.cluster.local:5000/crud-api
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitRepo }}
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          config:
            path: ./repo/k8s-manifests/environments/region-b/frontend-values.yaml
            updates:
              - key: image.tag
                value: ${{ imageFrom(vars.frontend).Tag }}
        - uses: yaml-update
          config:
            path: ./repo/k8s-manifests/environments/region-b/crud-values.yaml
            updates:
              - key: image.tag
                value: ${{ imageFrom(vars.crud).Tag }}
        - uses: git-commit
          config:
            path: ./repo
            message: "region-b: frontend-api ${{ imageFrom(vars.frontend).Tag }}, crud-api ${{ imageFrom(vars.crud).Tag }} (promoted by Kargo)"
        - uses: git-push
          config:
            path: ./repo
        - uses: argocd-update
          config:
            apps:
              - name: region-b-frontend-api
                namespace: argocd
              - name: region-b-crud-api
                namespace: argocd
---
# Cell A: only versions region B already has.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: cell-a
  namespace: local-eks-platform
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: app-images
      sources:
        stages:
          - region-b
  promotionTemplate:
    spec:
      vars:
        - name: gitRepo
          value: https://github.com/mandar33/local-eks-platform.git
        - name: frontend
          value: zot.registry.svc.cluster.local:5000/frontend-api
        - name: crud
          value: zot.registry.svc.cluster.local:5000/crud-api
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitRepo }}
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          config:
            path: ./repo/k8s-manifests/environments/dev/cells/cell-a.yaml
            updates:
              - key: spec.frontendTag
                value: ${{ imageFrom(vars.frontend).Tag }}
              - key: spec.crudTag
                value: ${{ imageFrom(vars.crud).Tag }}
        - uses: git-commit
          config:
            path: ./repo
            message: "cell-a: frontend-api ${{ imageFrom(vars.frontend).Tag }}, crud-api ${{ imageFrom(vars.crud).Tag }} (promoted by Kargo)"
        - uses: git-push
          config:
            path: ./repo
        - uses: argocd-update
          config:
            apps:
              - name: cell-a
                namespace: argocd
---
# Cell B: only versions cell A already has.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: cell-b
  namespace: local-eks-platform
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: app-images
      sources:
        stages:
          - cell-a
  promotionTemplate:
    spec:
      vars:
        - name: gitRepo
          value: https://github.com/mandar33/local-eks-platform.git
        - name: frontend
          value: zot.registry.svc.cluster.local:5000/frontend-api
        - name: crud
          value: zot.registry.svc.cluster.local:5000/crud-api
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitRepo }}
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          config:
            path: ./repo/k8s-manifests/environments/dev/cells/cell-b.yaml
            updates:
              - key: spec.frontendTag
                value: ${{ imageFrom(vars.frontend).Tag }}
              - key: spec.crudTag
                value: ${{ imageFrom(vars.crud).Tag }}
        - uses: git-commit
          config:
            path: ./repo
            message: "cell-b: frontend-api ${{ imageFrom(vars.frontend).Tag }}, crud-api ${{ imageFrom(vars.crud).Tag }} (promoted by Kargo)"
        - uses: git-push
          config:
            path: ./repo
        - uses: argocd-update
          config:
            apps:
              - name: cell-b
                namespace: argocd
---
# GitHub credentials: Vault -> Vault Secrets Operator -> labelled Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kargo-git
  namespace: local-eks-platform
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: local-eks-platform
spec:
  address: http://vault.vault.svc.cluster.local:8200
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: kargo-git
  namespace: local-eks-platform
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: kargo-git
    serviceAccount: kargo-git
    audiences: ["vault"]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: github-creds
  namespace: local-eks-platform
spec:
  vaultAuthRef: kargo-git
  type: kv-v2
  mount: kv
  path: kargo/github
  refreshAfter: 60s
  destination:
    name: github-creds
    create: true
    labels:
      kargo.akuity.io/cred-type: git
