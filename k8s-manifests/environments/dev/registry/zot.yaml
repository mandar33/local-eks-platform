# Zot: a small OCI registry (CNCF) for app images and Helm charts.
#
#   laptop  ──docker push localhost:5001──▶  NodePort 30500  ──▶  zot:5000 (TLS)
#   kind nodes pull localhost:5001/<image> through a containerd mirror
#   "compat: docker2s2" accepts images pushed by `docker push` (Docker v2
#   manifests) as well as OCI ones.
#   Kargo watches zot.registry.svc.cluster.local:5000
#
# Anyone in the cluster can pull. Pushing needs the `pusher` login, whose
# password lives only in Vault (see scripts/setup-registry.sh).
apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
# TLS: a self-signed root, a CA issuer from it, and Zot's serving certificate.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned
  namespace: registry
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: registry-ca
  namespace: registry
spec:
  isCA: true
  commonName: local-eks-platform registry CA
  secretName: registry-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: registry-ca
  namespace: registry
spec:
  ca:
    secretName: registry-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zot-tls
  namespace: registry
spec:
  secretName: zot-tls
  duration: 8760h
  renewBefore: 720h
  dnsNames:
    - zot.registry.svc.cluster.local
    - zot.registry.svc
    - localhost
    - dev-cluster-control-plane
  ipAddresses:
    - 127.0.0.1
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: registry-ca
    kind: Issuer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-config
  namespace: registry
data:
  config.json: |
    {
      "distSpecVersion": "1.1.1",
      "storage": {
        "rootDirectory": "/var/lib/registry",
        "gc": true,
        "dedupe": true
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "compat": ["docker2s2"],
        "tls": {
          "cert": "/etc/zot/tls/tls.crt",
          "key": "/etc/zot/tls/tls.key"
        },
        "auth": {
          "htpasswd": { "path": "/etc/zot/auth/htpasswd" }
        },
        "accessControl": {
          "repositories": {
            "**": {
              "anonymousPolicy": ["read"],
              "policies": [
                { "users": ["pusher"], "actions": ["read", "create", "update", "delete"] }
              ]
            }
          }
        }
      },
      "log": { "level": "info" },
      "extensions": {
        "search": {
          "enable": true,
          "cve": { "updateInterval": "24h" }
        },
        "ui": { "enable": true }
      }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zot-data
  namespace: registry
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  # Identity Vault checks before handing out the htpasswd file.
  name: zot
  namespace: registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot
  namespace: registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zot
  template:
    metadata:
      labels:
        app: zot
    spec:
      serviceAccountName: zot
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: zot
          image: ghcr.io/project-zot/zot-linux-amd64:v2.1.21
          args: ["serve", "/etc/zot/config.json"]
          ports:
            - name: https
              containerPort: 5000
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/zot/config.json
              subPath: config.json
            - name: tls
              mountPath: /etc/zot/tls
              readOnly: true
            - name: htpasswd
              mountPath: /etc/zot/auth
              readOnly: true
            - name: data
              mountPath: /var/lib/registry
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: zot-config
        - name: tls
          secret:
            secretName: zot-tls
        - name: htpasswd
          secret:
            secretName: zot-htpasswd
            items:
              - key: htpasswd
                path: htpasswd
        - name: data
          persistentVolumeClaim:
            claimName: zot-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: zot
  namespace: registry
spec:
  type: NodePort
  selector:
    app: zot
  ports:
    - name: https
      port: 5000
      targetPort: https
      nodePort: 30500
---
# The htpasswd file (bcrypt hash of the pusher password) comes from Vault.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: registry
spec:
  address: http://vault.vault.svc.cluster.local:8200
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: zot
  namespace: registry
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: zot
    serviceAccount: zot
    audiences: ["vault"]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: zot-htpasswd
  namespace: registry
spec:
  vaultAuthRef: zot
  type: kv-v2
  mount: kv
  path: registry/htpasswd
  refreshAfter: 60s
  destination:
    name: zot-htpasswd
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: zot
