apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: platform-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
# Two groups of frontend pods, told apart by the chart's `track` label.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: frontend-api
spec:
  host: frontend-api-svc.default.svc.cluster.local
  subsets:
  - name: stable
    labels:
      track: stable
  - name: canary
    labels:
      track: canary
---
# Traffic from the gateway (users). Canary weight lives here:
#   0   = canary gets nothing (use this when canary.enabled is false)
#   10  = one request in ten goes to the canary
# `x-canary: always` sends a request to the canary regardless of weight.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: frontend-routing
spec:
  gateways:
  - platform-gateway
  hosts:
  - "*"
  http:
  - name: force-canary
    match:
    - headers:
        x-canary:
          exact: always
    route:
    - destination:
        host: frontend-api-svc.default.svc.cluster.local
        subset: canary
        port:
          number: 80
    headers:
      response:
        set:
          x-region: a
  - name: weighted
    route:
    - destination:
        host: frontend-api-svc.default.svc.cluster.local
        subset: stable
        port:
          number: 80
      weight: 90
    - destination:
        host: frontend-api-svc.default.svc.cluster.local
        subset: canary
        port:
          number: 80
      weight: 10
    headers:
      response:
        set:
          x-region: a
---
# Same split for calls from inside the mesh. Keep the weights in step with
# frontend-routing above.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: frontend-api-mesh
spec:
  gateways:
  - mesh
  hosts:
  - frontend-api-svc.default.svc.cluster.local
  http:
  - name: force-canary
    match:
    - headers:
        x-canary:
          exact: always
    route:
    - destination:
        host: frontend-api-svc.default.svc.cluster.local
        subset: canary
  - name: weighted
    route:
    - destination:
        host: frontend-api-svc.default.svc.cluster.local
        subset: stable
      weight: 90
    - destination:
        host: frontend-api-svc.default.svc.cluster.local
        subset: canary
      weight: 10
---
# Cell router for http://cells.localhost:8080. Real systems look the user up
# in a routing table; here the user ID's last digit decides:
#   odd  -> cell a      even -> cell b      x-cell: a|b pins a request
# Responses carry an x-cell header saying which cell answered.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: cell-router
spec:
  gateways:
  - platform-gateway
  hosts:
  - cells.localhost
  http:
  - name: pinned-a
    match:
    - headers:
        x-cell:
          exact: a
    route:
    - destination:
        host: frontend-api-svc.cell-a.svc.cluster.local
        port:
          number: 80
    headers:
      response:
        set:
          x-cell: "a"
  - name: pinned-b
    match:
    - headers:
        x-cell:
          exact: b
    route:
    - destination:
        host: frontend-api-svc.cell-b.svc.cluster.local
        port:
          number: 80
    headers:
      response:
        set:
          x-cell: "b"
  - name: odd-users
    match:
    - uri:
        regex: "/users/[0-9]*[13579]"
    route:
    - destination:
        host: frontend-api-svc.cell-a.svc.cluster.local
        port:
          number: 80
    headers:
      response:
        set:
          x-cell: "a"
  - name: even-users
    match:
    - uri:
        regex: "/users/[0-9]*[02468]"
    route:
    - destination:
        host: frontend-api-svc.cell-b.svc.cluster.local
        port:
          number: 80
    headers:
      response:
        set:
          x-cell: "b"
  - name: everything-else
    route:
    - destination:
        host: frontend-api-svc.cell-a.svc.cluster.local
        port:
          number: 80
    headers:
      response:
        set:
          x-cell: "a"
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-frontend-to-crud
spec:
  selector:
    matchLabels:
      app: crud-api
  action: ALLOW
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/default/sa/frontend-api"]
