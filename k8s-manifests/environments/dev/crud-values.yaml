nameOverride: crud-api

image:
  repository: localhost:5001/crud-api
  tag: 1.0.0

env:
  DB_HOST: postgres.data.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: crud

# Short-lived DB credentials issued by Vault's database engine.
# The Vault Secrets Operator writes them to the crud-db Secret
# (see environments/dev/secrets/) and restarts crud-api when they rotate.
secretEnv:
  DB_USER:
    secret: crud-db
    key: username
  DB_PASSWORD:
    secret: crud-db
    key: password

autoscaling:
  minReplicas: 1
  maxReplicas: 3
