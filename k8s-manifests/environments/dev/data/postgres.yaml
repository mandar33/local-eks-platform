# Postgres for crud-api. No credentials live in Git:
# - the admin password comes from the postgres-admin Secret, generated by
#   scripts/bootstrap-vault.sh and handed to Vault, which then rotates it;
# - apps get short-lived users from Vault's database engine.
apiVersion: v1
kind: Namespace
metadata:
  name: data
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: data
data:
  01-schema.sql: |
    CREATE TABLE users_v1 (id INT PRIMARY KEY, standard_data TEXT NOT NULL);
    CREATE TABLE users_v2 (id INT PRIMARY KEY, experimental_data JSONB NOT NULL);
    INSERT INTO users_v1 VALUES
      (1, 'Alice (v1 schema)'),
      (2, 'Bob (v1 schema)');
    INSERT INTO users_v2 VALUES
      (1, '{"name": "Alice", "schema": "v2", "tier": "gold"}'),
      (2, '{"name": "Bob", "schema": "v2", "tier": "silver"}');
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: data
spec:
  selector:
    app: postgres
  ports:
    - name: tcp-postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: data
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: crud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "crud"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
