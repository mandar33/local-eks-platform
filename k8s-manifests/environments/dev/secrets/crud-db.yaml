# crud-api's database credentials, delivered by the Vault Secrets Operator (VSO).
# Nothing secret is stored here: VSO logs in to Vault as crud-api's
# ServiceAccount, asks the database engine for a short-lived Postgres user,
# writes it to the crud-db Secret, and restarts crud-api when it rotates.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: default
spec:
  address: http://vault.vault.svc.cluster.local:8200
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: crud-api
  namespace: default
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: crud-api
    serviceAccount: crud-api
    audiences: ["vault"]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: crud-db
  namespace: default
spec:
  vaultAuthRef: crud-api
  mount: database
  path: creds/crud-api
  destination:
    name: crud-db
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: crud-api
