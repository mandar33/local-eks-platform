# Cell a. Kargo's "cell-a" Stage updates the two tags below when you promote
# a release to it (scripts/promote.sh cell-a <version>). The cell router
# (networking/istio-networking.yaml, host cells.localhost) sends odd user
# IDs here.
apiVersion: platform.local/v1alpha1
kind: Cell
metadata:
  name: a
spec:
  frontendTag: 1.2.7
  crudTag: 1.2.7
