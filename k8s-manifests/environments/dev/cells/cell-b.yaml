# Cell b. Kargo's "cell-b" Stage updates the two tags below when you promote
# a release to it (scripts/promote.sh cell-b <version>). The cell router
# (networking/istio-networking.yaml, host cells.localhost) sends even user
# IDs here.
apiVersion: platform.local/v1alpha1
kind: Cell
metadata:
  name: b
spec:
  frontendTag: 1.2.7
  crudTag: 1.2.7
