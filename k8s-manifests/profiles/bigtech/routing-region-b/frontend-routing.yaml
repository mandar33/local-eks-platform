apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: frontend-routing
spec:
  gateways:
  - platform-gateway
  hosts:
  - "*"
  http:
  - route:
    - destination:
        host: frontend-api-svc.prod-b1.svc.cluster.local
        port:
          number: 80
    headers:
      response:
        set:
          x-region: b
          x-cell: prod-b1
