# Prod waves (bigtech profile), synced by the prod-kargo app.
# staging -> prod-a1 (wave 1, the canary cell: promoted by hand)
#         -> prod-a2 (wave 2) -> prod-b1 (wave 3, region B)
# Waves 2 and 3 promote themselves (ProjectConfig below) once the release has
# run in the previous cell for requiredSoakTime (the bake time).
# Wave 1: one cell in region A. Only versions staging already has.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod-a1
  namespace: local-eks-platform
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: app-images
      sources:
        stages:
          - staging
  promotionTemplate:
    spec:
      vars:
        - name: gitRepo
          value: https://github.com/mandar33/local-eks-platform.git
        - name: frontend
          value: zot.registry.svc.cluster.local:5000/frontend-api
        - name: crud
          value: zot.registry.svc.cluster.local:5000/crud-api
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitRepo }}
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          config:
            path: ./repo/k8s-manifests/apps/prod/prod-a1/frontend-values.yaml
            updates:
              - key: image.tag
                value: ${{ imageFrom(vars.frontend).Tag }}
        - uses: yaml-update
          config:
            path: ./repo/k8s-manifests/apps/prod/prod-a1/crud-values.yaml
            updates:
              - key: image.tag
                value: ${{ imageFrom(vars.crud).Tag }}
        - uses: git-commit
          config:
            path: ./repo
            message: "prod-a1: frontend-api ${{ imageFrom(vars.frontend).Tag }}, crud-api ${{ imageFrom(vars.crud).Tag }} (promoted by Kargo)"
        - uses: git-push
          config:
            path: ./repo
        - uses: argocd-update
          config:
            apps:
              - name: frontend-api-prod-a1
                namespace: argocd
              - name: crud-api-prod-a1
                namespace: argocd
---
# Wave 2: after 10 minutes in prod-a1.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod-a2
  namespace: local-eks-platform
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: app-images
      sources:
        stages:
          - prod-a1
        requiredSoakTime: 10m0s   # Kargo stores durations this way; "10m" shows as OutOfSync
  promotionTemplate:
    spec:
      vars:
        - name: gitRepo
          value: https://github.com/mandar33/local-eks-platform.git
        - name: frontend
          value: zot.registry.svc.cluster.local:5000/frontend-api
        - name: crud
          value: zot.registry.svc.cluster.local:5000/crud-api
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitRepo }}
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          config:
            path: ./repo/k8s-manifests/apps/prod/prod-a2/frontend-values.yaml
            updates:
              - key: image.tag
                value: ${{ imageFrom(vars.frontend).Tag }}
        - uses: yaml-update
          config:
            path: ./repo/k8s-manifests/apps/prod/prod-a2/crud-values.yaml
            updates:
              - key: image.tag
                value: ${{ imageFrom(vars.crud).Tag }}
        - uses: git-commit
          config:
            path: ./repo
            message: "prod-a2: frontend-api ${{ imageFrom(vars.frontend).Tag }}, crud-api ${{ imageFrom(vars.crud).Tag }} (promoted by Kargo)"
        - uses: git-push
          config:
            path: ./repo
        - uses: argocd-update
          config:
            apps:
              - name: frontend-api-prod-a2
                namespace: argocd
              - name: crud-api-prod-a2
                namespace: argocd
---
# Wave 3: region B, after 10 minutes in prod-a2.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod-b1
  namespace: local-eks-platform
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: app-images
      sources:
        stages:
          - prod-a2
        requiredSoakTime: 10m0s   # Kargo stores durations this way; "10m" shows as OutOfSync
  promotionTemplate:
    spec:
      vars:
        - name: gitRepo
          value: https://github.com/mandar33/local-eks-platform.git
        - name: frontend
          value: zot.registry.svc.cluster.local:5000/frontend-api
        - name: crud
          value: zot.registry.svc.cluster.local:5000/crud-api
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitRepo }}
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          config:
            path: ./repo/k8s-manifests/apps/prod/prod-b1/frontend-values.yaml
            updates:
              - key: image.tag
                value: ${{ imageFrom(vars.frontend).Tag }}
        - uses: yaml-update
          config:
            path: ./repo/k8s-manifests/apps/prod/prod-b1/crud-values.yaml
            updates:
              - key: image.tag
                value: ${{ imageFrom(vars.crud).Tag }}
        - uses: git-commit
          config:
            path: ./repo
            message: "prod-b1: frontend-api ${{ imageFrom(vars.frontend).Tag }}, crud-api ${{ imageFrom(vars.crud).Tag }} (promoted by Kargo)"
        - uses: git-push
          config:
            path: ./repo
        - uses: argocd-update
          config:
            apps:
              - name: frontend-api-prod-b1
                namespace: argocd
              - name: crud-api-prod-b1
                namespace: argocd
---
# Auto-promotion for the later waves. Wave 1 stays manual: a person decides a
# release goes to prod.
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: local-eks-platform
  namespace: local-eks-platform
spec:
  promotionPolicies:
    - stageSelector:
        name: prod-a2
      autoPromotionEnabled: true
    - stageSelector:
        name: prod-b1
      autoPromotionEnabled: true
