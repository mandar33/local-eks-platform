# Prod: localhost:8080 (and anything not matched above, including
# cells.localhost and the global LB on localhost:7080) goes to region A's
# prod cells. Real systems look the user up in a routing table; here the
# user ID's last digit decides:
#   odd -> prod-a1      even -> prod-a2      x-cell: prod-a1|prod-a2 pins a request
# Responses carry x-cell saying which cell answered.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: prod-router
  annotations:
    # Moving to profiles/bigtech (phase 8): the old app must not delete it meanwhile.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  gateways:
  - platform-gateway
  hosts:
  - "*"
  http:
  - name: pinned-a1
    match:
    - headers:
        x-cell:
          exact: prod-a1
    route:
    - destination:
        host: frontend-api-svc.prod-a1.svc.cluster.local
        port:
          number: 80
    headers:
      response:
        set:
          x-region: a
          x-cell: prod-a1
  - name: pinned-a2
    match:
    - headers:
        x-cell:
          exact: prod-a2
    route:
    - destination:
        host: frontend-api-svc.prod-a2.svc.cluster.local
        port:
          number: 80
    headers:
      response:
        set:
          x-region: a
          x-cell: prod-a2
  - name: odd-users
    match:
    - uri:
        regex: "/users/[0-9]*[13579]"
    route:
    - destination:
        host: frontend-api-svc.prod-a1.svc.cluster.local
        port:
          number: 80
    headers:
      response:
        set:
          x-region: a
          x-cell: prod-a1
  - name: even-users
    match:
    - uri:
        regex: "/users/[0-9]*[02468]"
    route:
    - destination:
        host: frontend-api-svc.prod-a2.svc.cluster.local
        port:
          number: 80
    headers:
      response:
        set:
          x-region: a
          x-cell: prod-a2
  - name: everything-else
    route:
    - destination:
        host: frontend-api-svc.prod-a1.svc.cluster.local
        port:
          number: 80
    headers:
      response:
        set:
          x-region: a
          x-cell: prod-a1
