# Region B's front door in the small profile: localhost:9080 (and the global
# LB on localhost:7080) -> prod. Canary weight lives here:
#   0  = canary gets nothing (use this when canary.enabled is false)
#   10 = one request in ten goes to the canary
# `x-canary: always` sends a request to the canary regardless of weight.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: frontend-api
  # In the service's namespace, or Istio ignores it (see notes/findings.md).
  namespace: prod
spec:
  host: frontend-api-svc.prod.svc.cluster.local
  subsets:
  - name: stable
    labels:
      track: stable
  - name: canary
    labels:
      track: canary
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: frontend-routing
spec:
  gateways:
  - platform-gateway
  hosts:
  - "*"
  http:
  - name: force-canary
    match:
    - headers:
        x-canary:
          exact: always
    route:
    - destination:
        host: frontend-api-svc.prod.svc.cluster.local
        subset: canary
        port:
          number: 80
    headers:
      response:
        set:
          x-region: b
          x-env: prod
  - name: weighted
    route:
    - destination:
        host: frontend-api-svc.prod.svc.cluster.local
        subset: stable
        port:
          number: 80
      weight: 100
    - destination:
        host: frontend-api-svc.prod.svc.cluster.local
        subset: canary
        port:
          number: 80
      weight: 0
    headers:
      response:
        set:
          x-region: b
          x-env: prod
