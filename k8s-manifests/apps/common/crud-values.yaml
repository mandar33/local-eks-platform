# Shared by every copy of crud-api (dev, region B, cells). Each copy layers
# its own file from apps/<copy>/ on top, with at least image.tag.
nameOverride: crud-api

image:
  repository: localhost:5001/crud-api

env:
  DB_HOST: postgres.data.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: crud

# Short-lived DB credentials issued by Vault's database engine.
# The Vault Secrets Operator writes them to the crud-db Secret
# (see platform/region-a/secrets/) and restarts crud-api when they rotate.
secretEnv:
  DB_USER:
    secret: crud-db
    key: username
  DB_PASSWORD:
    secret: crud-db
    key: password

autoscaling:
  minReplicas: 1
  maxReplicas: 3
