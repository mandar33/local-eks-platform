# Prod (small profile, region B), layered on apps/common/crud-values.yaml.
# Kargo's "prod" Stage updates image.tag.
image:
  tag: 1.2.8

# Region B's own Postgres (database crud, the common default). Users come
# from region A's Vault through region B's own auth mount.
vaultDbCredentials:
  enabled: true
  address: http://dev-cluster-control-plane:30820
  authMount: kubernetes-region-b
  role: crud-api
  path: creds/crud-api-region-b
allowCallersFrom:
  - frontend-api

autoscaling:
  minReplicas: 2
  maxReplicas: 4
podDisruptionBudget:
  minAvailable: 1
