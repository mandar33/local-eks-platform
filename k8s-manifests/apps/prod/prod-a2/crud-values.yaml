# Cell prod-a2 (region A, bigtech profile), layered on apps/common/crud-values.yaml.
# Kargo's "prod-a2" Stage updates image.tag.
image:
  tag: 1.2.9

# The cell's own database (scripts/bootstrap-vault.sh databases).
env:
  DB_NAME: crud_prod_a2

vaultDbCredentials:
  enabled: true
  role: crud-api-prod-a2
  path: creds/crud-api-prod-a2
allowCallersFrom:
  - frontend-api
