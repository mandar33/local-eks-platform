apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: region-b-postgres
  namespace: argocd
spec:
  # Region B's own database. Its admin password comes from
  # scripts/setup-region.sh database; until then the pod waits for it.
  project: default
  source:
    repoURL: https://github.com/mandar33/local-eks-platform.git
    targetRevision: main
    path: k8s-manifests/platform/region-b/data
  destination:
    name: region-b
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: region-b-networking
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mandar33/local-eks-platform.git
    targetRevision: main
    path: k8s-manifests/platform/region-b/networking
  destination:
    name: region-b
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: region-b-flipt
  namespace: argocd
spec:
  # Region B's own Flipt, same settings as region A.
  project: default
  sources:
    # Flipt's official chart, pinned...
    - repoURL: https://helm.flipt.io
      chart: flipt
      targetRevision: 0.87.9
      helm:
        releaseName: flipt
        valueFiles:
          - $values/k8s-manifests/platform/region-a/flipt-values.yaml
    # ...with its values from this repo ("$values" above points here).
    - repoURL: https://github.com/mandar33/local-eks-platform.git
      targetRevision: main
      ref: values
  destination:
    name: region-b
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
