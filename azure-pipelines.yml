# The same pipeline as .github/workflows/build.yml, written for Azure DevOps.
# NOT CONNECTED: nothing runs this file. It's here to compare the two syntaxes;
# it would work if the repo were added to an Azure DevOps project with a
# self-hosted agent pool named "local-eks-platform".
#
#   GitHub Actions                        Azure Pipelines
#   on: push (branches, paths)            trigger: (branches, paths)
#   (no pull_request trigger)             pr: none
#   jobs.<id>                             stages > jobs
#   runs-on: [self-hosted, <label>]       pool: <agent pool name>
#   strategy.matrix                       strategy.matrix
#   needs: build                          dependsOn: Build
#   environment: dev (required reviewer)  deployment job + environment "dev" (Approvals and checks)
#   run: |                                script: |
#   ${{ github.run_number }}              $(Build.BuildId)
#   env: at workflow level                variables:
#   GITHUB_ENV (pass values between steps) ##vso[task.setvariable]

trigger:
  branches:
    include: [main]
  paths:
    include:
      - apps/*
      - azure-pipelines.yml

pr: none   # never on pull requests: the agent runs on your laptop

variables:
  VERSION: 1.2.$(Build.BuildId)
  VAULT_ADDR: http://dev-cluster-control-plane:30820
  ZOT_API: https://dev-cluster-control-plane:30500
  KUBECONFIG: /home/runner/.ci/kubeconfig

stages:
  - stage: Build
    jobs:
      - job: Build
        displayName: Build $(app)
        pool: local-eks-platform
        strategy:
          matrix:
            frontend:
              app: frontend-api
            crud:
              app: crud-api
        steps:
          - checkout: self

          - script: |
              curl -fsS -H "X-Vault-Token: $(cat /home/runner/.ci/vault-token)" \
                "$(VAULT_ADDR)/v1/kv/data/registry/pusher" \
              | jq -r .data.data.password \
              | docker login localhost:5001 --username pusher --password-stdin
            displayName: Log in to Zot (password read from Vault)

          - script: docker build -t "localhost:5001/$(app):$(VERSION)" "apps/$(app)"
            displayName: Build the image

          - script: docker push "localhost:5001/$(app):$(VERSION)"
            displayName: Push to Zot

          - script: |
              query="{\"query\":\"{ CVEListForImage(image: \\\"$(app):$(VERSION)\\\") { Summary { Count HighCount CriticalCount } } }\"}"
              for _ in $(seq 1 30); do
                summary=$(curl -fsSk -X POST "$(ZOT_API)/v2/_zot/ext/search" -H 'Content-Type: application/json' -d "$query" \
                  | jq -c '.data.CVEListForImage.Summary // empty')
                [ -n "$summary" ] && break
                sleep 5
              done
              echo "Scan: $summary"
              bad=$(echo "$summary" | jq '.HighCount + .CriticalCount')
              if [ "$bad" -gt 0 ]; then
                echo "##vso[task.logissue type=error]$(app):$(VERSION) has $bad high/critical vulnerabilities"
                exit 1
              fi
            displayName: Fail on high or critical vulnerabilities

  - stage: PromoteDev
    dependsOn: Build
    jobs:
      # A deployment job targets an environment; the approval is configured on
      # the environment in the Azure DevOps UI (Pipelines > Environments > dev).
      - deployment: Promote
        displayName: Promote frontend-api to dev
        pool: local-eks-platform
        environment: dev
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    kubectl annotate warehouse frontend-images kargo.akuity.io/refresh="$(date +%s)" --overwrite
                    for _ in $(seq 1 36); do
                      freight=$(kubectl get freight -o json \
                        | jq -r --arg v "$(VERSION)" '.items[] | select(.images[0].tag == $v) | .metadata.name')
                      [ -n "$freight" ] && break
                      sleep 5
                    done
                    echo "##vso[task.setvariable variable=FREIGHT]$freight"
                  displayName: Wait for Kargo to see the new image

                - script: |
                    promotion=$(kubectl create -o name -f - <<EOF
                    apiVersion: kargo.akuity.io/v1alpha1
                    kind: Promotion
                    metadata:
                      generateName: dev-
                    spec:
                      stage: dev
                      freight: $(FREIGHT)
                    EOF
                    )
                    for _ in $(seq 1 60); do
                      phase=$(kubectl get "$promotion" -o jsonpath='{.status.phase}')
                      [ "$phase" = Succeeded ] && exit 0
                      case "$phase" in Failed|Errored|Aborted) exit 1 ;; esac
                      sleep 5
                    done
                    exit 1
                  displayName: Promote to dev
