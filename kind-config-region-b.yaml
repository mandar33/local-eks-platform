# Second "region" for the multi-region setup:
#   kind create cluster --name region-b --config=kind-config-region-b.yaml
# Smaller than dev-cluster (one worker) to fit on a laptop.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
    # Region B's Istio gateway on localhost:9080 (region A uses 8080).
    extraPortMappings:
      - containerPort: 30080
        hostPort: 9080
        protocol: TCP
      - containerPort: 30443
        hostPort: 9443
        protocol: TCP
  - role: worker
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
